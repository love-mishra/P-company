<!DOCTYPE html>
<html lang="en">
<head>


    <!-- Contact Section -->
    <section id="contact" class="contact-section">
        <div class="contact-grid">
            <!-- Contact Form -->
            <div class="contact-form">
                <h2 class="form-title">Send Us a Message</h2>
                <form>
                    <div class="form-group">
                        <input type="text" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                        <input type="tel" placeholder="Your Phone">
                    </div>
                    <div class="form-group">
                        <select required>
                            <option value="">Select Project Type</option>
                            <option value="website">Website Development</option>
                            <option value="ecommerce">E-commerce Store</option>
                            <option value="mobile">Mobile App</option>
                            <option value="design">UI/UX Design</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <textarea rows="5" placeholder="Tell us about your project" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>

            <!-- Contact Info -->
            <div class="contact-info">
                <h2 class="info-title">Get in Touch</h2>
                
                <div class="info-item">
                    <div class="info-icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <div class="info-text">
                        <h4>Visit Our Office</h4>
                        <p>123 Business Street<br>Tech City, TC 12345</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="fas fa-phone"></i>
                    </div>
                    <div class="info-text">
                        <h4>Call Us</h4>
                        <p>+1 (234) 567-8900<br>Mon-Fri 9AM-6PM</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="info-text">
                        <h4>Email Us</h4>
                        <p>hello@pcompany.com<br>We respond within 24 hours</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="info-text">
                        <h4>Business Hours</h4>
                        <p>Monday - Friday: 9AM - 6PM<br>Weekend: By appointment</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Smooth scrolling for the CTA button
        document.querySelector('.cta-button').addEventListener('click', function(e) {
            e.preventDefault();
            document.querySelector('#contact').scrollIntoView({
                behavior: 'smooth'
            });
        });
    </script>
</body>
</html>
