<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - P Company</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css'>
    <link rel="stylesheet" href="/style/style.css">
</head>
<body>
    <div id="signbg">
        <div class="signup-form">
            <div class="form-header">
                <a href="/index.html" class="back-link">
                    <i class="fa fa-arrow-left"></i>
                    <span>Back to Home</span>
                </a>
                <div class="logo-section">
                    <img src="./imag/logo.jpg" alt="P Company Logo" class="signup-logo">
                </div>
            </div>
            
            <h2>Create Your Account</h2>
            <p class="signup-subtitle">Join P Company and discover amazing products</p>
            
            <form id="signup-form">
                <div class="input-group">
                    <label for="username"><i class="fa fa-user"></i> Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>
                
                <div class="input-group">
                    <label for="email"><i class="fa fa-envelope"></i> Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="input-group">
                    <label for="password"><i class="fa fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                
                <div class="form-actions">
                    <button type="button" id="submit-button" class="btn-primary">
                        <i class="fa fa-user-plus"></i> Create Account
                    </button>
                    <button type="reset" id="reset" class="btn-secondary">
                        <i class="fa fa-refresh"></i> Reset Form
                    </button>
                </div>
                
                <div class="signin-link">
                    <p>Already have an account? <a href="signin.html">Sign In <i class="fa fa-arrow-right"></i></a></p>
                </div>
            </form>
        </div>
    </div>


    <script   >
       document.addEventListener('DOMContentLoaded', function() {
    const signUpForm = document.getElementById('signup-form');
    const submitButton = document.getElementById('submit-button');
    const resultMessage = document.getElementById('result-message');

    if (submitButton) {
        submitButton.addEventListener('click', function() {
            // Simulate form validation (replace with your actual validation logic)
            const username = signUpForm.querySelector('#username').value;
            const email = signUpForm.querySelector('#email').value;
            const password = signUpForm.querySelector('#password').value;

            let message = '';
            if (username && email && password) {
                // Success message
                
                message = 'Sign-up successful!';
            } else {
                // Error message
                message = 'Error: Please fill in all fields.';
            }

            // Encode the message for URL
            const encodedMessage = encodeURIComponent(message);

            // Redirect to another page with the result message
            
            window.location.href = 'result.html?message=' + encodedMessage;
        });
    }

    // Prevent the default form submission action
    if (signUpForm) {
        signUpForm.addEventListener('submit-button', function(e) {
            e.preventDefault();
        });

        // Hide the result message when the user interacts with the form again
        signUpForm.addEventListener('input', function() {
            resultMessage.classList.add('hidden');
        });
    }
});

    </script>
</body>
</html>
